<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DilSe AI ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffe0ed, #e6d9ff);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 12px;
}

.app {
  width: 100%;
  max-width: 430px;
  height: 92vh;
  max-height: 800px;
  background: white;
  border-radius: 25px;
  overflow: hidden;
  box-shadow: 0 10px 35px #0002;
  display: flex;
  flex-direction: column;
}

header {
  background: #ff4f87;
  color: white;
  padding: 17px;
  text-align: center;
}

header h2 {
  margin: 0 0 5px;
}

header small {
  opacity: .9;
}

.profile {
  text-align: center;
  padding: 12px;
  background: #fff5f8;
}

.profile img {
  width: 95px;
  height: 95px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid #ff8bb0;
}

.profile h3 {
  margin: 7px 0 3px;
  color: #e73571;
}

.profile p {
  margin: 3px;
  color: #777;
  font-size: 13px;
}

.status {
  font-size: 12px;
  color: #24945b;
  margin-top: 5px;
}

#chat {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 14px;
  background: #fffafd;
}

.msg {
  padding: 11px 14px;
  margin: 8px 0;
  border-radius: 17px;
  max-width: 85%;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  line-height: 1.5;
}

.bot {
  background: #ffe3ed;
  color: #63213a;
  margin-right: auto;
}

.user {
  background: #e6ddff;
  color: #39275e;
  margin-left: auto;
}

.controls {
  display: flex;
  gap: 7px;
  padding: 10px;
  background: white;
}

input {
  min-width: 0;
  flex: 1;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 22px;
  outline-color: #ff4f87;
  font-size: 15px;
}

button {
  border: none;
  padding: 11px 13px;
  border-radius: 18px;
  background: #ff4f87;
  color: white;
  font-size: 14px;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.extras {
  display: flex;
  gap: 8px;
  padding: 0 10px 12px;
  justify-content: center;
}

.extras button {
  background: #eee6ff;
  color: #6235a5;
  font-size: 13px;
}

footer {
  font-size: 11px;
  text-align: center;
  padding: 7px;
  color: #888;
}
</style>
</head>

<body>

<div class="app">

  <header>
    <h2>❤️ DilSe AI</h2>
    <small>Your AI Companion</small>
  </header>

  <section class="profile">
    <img
      src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80"
      alt="Priya AI Companion"
    >

    <h3>Priya ❤️</h3>
    <p>Tumchi AI friend</p>
    <div class="status" id="status">AI Companion</div>
  </section>

  <div id="chat" aria-live="polite">
    <div class="msg bot">
      Hi! ❤️ Namaste!

      Mi Priya aahe. Tu kasa aahes?

      Aaj kay chalu aahe? 😊
    </div>
  </div>

  <div class="controls">
    <input
      id="message"
      type="text"
      placeholder="Priya la message kar..."
      aria-label="Message"
      autocomplete="off"
    >

    <button id="sendButton" onclick="sendMessage()">
      Send ➤
    </button>
  </div>

  <div class="extras">
    <button onclick="speakLast()">🔊 Voice</button>
    <button onclick="startVoice()">🎤 Bolun Type Kar</button>
    <button onclick="clearChat()">🗑️ Clear</button>
  </div>

  <footer>
    DilSe AI ❤️ • AI responses may sometimes be incorrect
  </footer>

</div>

<script>
const BACKEND_URL =
  "https://dilse-ai-backend.koreandramas499.workers.dev";

const chat = document.getElementById("chat");
const input = document.getElementById("message");
const sendButton = document.getElementById("sendButton");
const statusText = document.getElementById("status");

let lastReply = "Hi! ❤️ Namaste! Mi Priya aahe.";
let isSending = false;

/*
  Conversation history:
  This is kept in the current browser session.
*/
let conversation = [];

function addMessage(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;

  return div;
}

async function sendMessage() {
  const text = input.value.trim();

  if (!text || isSending) return;

  addMessage(text, "user");
  input.value = "";

  isSending = true;
  sendButton.disabled = true;
  statusText.textContent = "Priya is thinking... ❤️";

  const loadingMessage = addMessage(
    "Priya reply det aahe... ❤️",
    "bot"
  );

  /*
    Keep the latest conversation messages.
    Do not send an unlimited conversation history.
  */
  const updatedConversation = [
    ...conversation,
    {
      role: "user",
      content: text
    }
  ].slice(-12);

  try {
    const response = await fetch(BACKEND_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: updatedConversation
      })
    });

    let data;

    try {
      data = await response.json();
    } catch {
      throw new Error(
        "Backend kadun valid response milala nahi."
      );
    }

    if (!response.ok) {
      throw new Error(
        data.error || "Server error: " + response.status
      );
    }

    if (!data.reply || typeof data.reply !== "string") {
      throw new Error(
        "AI reply milala nahi. Backend code check kara."
      );
    }

    lastReply = data.reply;
    loadingMessage.textContent = data.reply;

    conversation = [
      ...updatedConversation,
      {
        role: "assistant",
        content: data.reply
      }
    ].slice(-12);

    statusText.textContent = "Connected ❤️";

  } catch (error) {
    console.error("DilSe AI Error:", error);

    loadingMessage.textContent =
      "Sorry ❤️, Priya la connect karta ala nahi.\n\n" +
      "Internet, backend URL ani Cloudflare Worker settings check kara.\n\n" +
      "Error: " + error.message;

    statusText.textContent = "Connection problem";

  } finally {
    isSending = false;
    sendButton.disabled = false;
    input.focus();
    chat.scrollTop = chat.scrollHeight;
  }
}

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    sendMessage();
  }
});

function speakLast() {
  if (!("speechSynthesis" in window)) {
    alert("Voice feature ya browser madhe available nahi.");
    return;
  }

  window.speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(lastReply);
  speech.lang = "mr-IN";
  speech.rate = 0.9;
  speech.pitch = 1;

  window.speechSynthesis.speak(speech);
}

function startVoice() {
  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Recognition) {
    alert(
      "Voice typing available nahi. Keyboard cha microphone vapra."
    );
    return;
  }

  const recognition = new Recognition();

  recognition.lang = "mr-IN";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onresult = function(event) {
    input.value = event.results[0][0].transcript;
    input.focus();
  };

  recognition.onerror = function() {
    alert(
      "Microphone permission check kara ani punha try kara."
    );
  };

  recognition.start();
}

function clearChat() {
  if (!confirm("Sagla chat clear karaycha aahe ka?")) {
    return;
  }

  conversation = [];
  lastReply = "Hi! ❤️ Namaste! Mi Priya aahe.";

  chat.innerHTML = "";

  addMessage(
    "Hi! ❤️ Namaste! Mi Priya aahe. Tu kasa aahes?",
    "bot"
  );

  statusText.textContent = "AI Companion";

  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }
}
</script>

</body>
</html>
