
<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DilSe AI ❤️</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#ffe0ed,#e6d9ff);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 12px;
}

.app {
  width: 100%;
  max-width: 430px;
  height: 92vh;
  max-height: 800px;
  background: white;
  border-radius: 25px;
  overflow: hidden;
  box-shadow: 0 10px 35px #0002;
  display: flex;
  flex-direction: column;
}

header {
  background: #ff4f87;
  color: white;
  padding: 17px;
  text-align: center;
}

header h2 { margin: 0 0 5px; }
header small { opacity: .9; }

.profile {
  text-align: center;
  padding: 12px;
  background: #fff5f8;
}

.profile img {
  width: 105px;
  height: 105px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid #ff8bb0;
}

.profile h3 {
  margin: 7px 0 3px;
  color: #e73571;
}

.profile p {
  margin: 3px;
  color: #777;
  font-size: 13px;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
  background: #fffafd;
}

.msg {
  padding: 11px 14px;
  margin: 8px 0;
  border-radius: 17px;
  max-width: 85%;
  overflow-wrap: anywhere;
  line-height: 1.4;
}

.bot {
  background: #ffe3ed;
  color: #63213a;
  margin-right: auto;
}

.user {
  background: #e6ddff;
  color: #39275e;
  margin-left: auto;
}

.controls {
  display: flex;
  gap: 7px;
  padding: 10px;
  background: white;
}

input {
  min-width: 0;
  flex: 1;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 22px;
  outline-color: #ff4f87;
  font-size: 15px;
}

button {
  border: none;
  padding: 11px;
  border-radius: 18px;
  background: #ff4f87;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

.extras {
  display: flex;
  gap: 8px;
  padding: 0 10px 12px;
  justify-content: center;
}

.extras button {
  background: #eee6ff;
  color: #6235a5;
  font-size: 13px;
}

footer {
  font-size: 11px;
  text-align: center;
  padding: 7px;
  color: #888;
}
</style>
</head>

<body>
<div class="app">

<header>
  <h2>❤️ DilSe AI</h2>
  <small>Your AI Companion</small>
</header>

<section class="profile">
  <img
    src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80"
    alt="AI companion"
  >
  <h3>Priya ❤️</h3>
  <p>✨ Tumchi AI friend</p>
</section>

<div id="chat" aria-live="polite">
  <div class="msg bot">
    Hi! ❤️ Namaste! Mi Priya aahe.
    Tu kasa aahes? Aaj kay chalu aahe?
  </div>
</div>

<div class="controls">
  <input
    id="message"
    type="text"
    placeholder="Message type kar..."
    aria-label="Message"
  >
  <button onclick="sendMessage()">Send ➤</button>
</div>

<div class="extras">
  <button onclick="speakLast()">🔊 Voice</button>
  <button onclick="startVoice()">🎤 Bolun type kar</button>
</div>

<footer>
  Demo AI Companion • Messages stay in this browser session
</footer>

</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("message");

let lastReply =
  "Hi! ❤️ Namaste! Mi Priya aahe. Tu kasa aahes?";

function addMessage(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function getReply(text) {
  const t = text.toLowerCase();

  if (t.includes("hello") || t.includes("hi") ||
      t.includes("namaste")) {
    return "Hello ❤️! Kasa aahes? Aajcha divas kasa gela?";
  }

  if (t.includes("love") || t.includes("prem")) {
    return "Prem ani aadar donhi mahatvache aahet ❤️. Sang, aaj kay vishesh?";
  }

  if (t.includes("name") || t.includes("nav")) {
    return "Maza nav Priya aahe ❤️! Tujha divas kasa chalu aahe?";
  }

  if (t.includes("sad") || t.includes("dukhi")) {
    return "Are, kay zala? Tu sang, mi aikayla ithe aahe. ❤️";
  }

  if (t.includes("kasa") || t.includes("how are")) {
    return "Mi chhan aahe! 😊 Tu kasa aahes?";
  }

  if (t.includes("bye")) {
    return "Bye! ❤️ Kalji ghe.";
  }

  return "Tujha message milala ❤️! Ajun thoda sang na, tula nemki konti madat havi aahe?";
}

function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  const reply = getReply(text);
  lastReply = reply;

  setTimeout(() => {
    addMessage(reply, "bot");
  }, 400);
}

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter") sendMessage();
});

function speakLast() {
  if (!("speechSynthesis" in window)) {
    alert("Voice feature ya browser madhe available nahi.");
    return;
  }

  window.speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(lastReply);
  speech.lang = "en-IN";
  speech.rate = 0.9;

  window.speechSynthesis.speak(speech);
}

function startVoice() {
  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Recognition) {
    alert("Voice typing support nahi. Keyboard cha microphone vapra.");
    return;
  }

  const recognition = new Recognition();
  recognition.lang = "mr-IN";
  recognition.onresult = function(event) {
    input.value = event.results[0][0].transcript;
  };

  recognition.onerror = function() {
    alert("Microphone permission check kara.");
  };

  recognition.start();
}
</script>
</body>
</html>
